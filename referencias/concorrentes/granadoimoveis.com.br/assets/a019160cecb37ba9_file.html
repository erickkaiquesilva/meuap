    <!-- Umami analytics - deferred; only loaded when configured with a real endpoint -->
    <script>
      (function() {

        // Skip when env vars weren't substituted at build time or point to localhost placeholder
        if (!_ep || _ep.indexOf('localhost') !== -1 || _ep.indexOf('%VITE_') !== -1 || !_wid || _wid === 'local') return;
        function loadUmami() {
          var s = document.createElement('script');
          s.defer = true;
          s.src = _ep + '/umami';
          s.dataset.websiteId = _wid;
          s.onerror = function() { s.remove(); };
          document.body.appendChild(s);
        }
        if (typeof requestIdleCallback !== 'undefined') {
          requestIdleCallback(loadUmami);
        } else {
          setTimeout(loadUmami, 2000);
        }
      })();
    </script>

    <!-- Leadster XHR interception: capture email + name + phone for Meta CAPI Lead event -->
    <!-- MUST run BEFORE Leadster loads so the patched XHR is used by Leadster -->
    <script>
    (function() {
      // Accumulate lead data across Leadster steps
      var _kenloLeadData = { nome: null, telefone: null, conversionType: null };

      // Classifica a conversão do bot pelo qualificador respondido, espelhando
      // os campos dos formulários das LPs:
      //   'contrato' -> qualificador de Locação ("contratos sob gestão")
      //   'tamanho'  -> qualificador de Imob ("tamanho da equipe" / usuários)
      // Varre chaves + valores do passo do bot procurando esses sinais.
      // OBS: os rótulos exatos vivem no painel do Leadster — se o fluxo mudar,
      // ajustar apenas esta função (ou fixar no rótulo exato do campo).
      function detectConversionType(data) {
        var blob = '';
        try { blob = JSON.stringify(data).toLowerCase(); } catch (e) { return null; }
        if (blob.indexOf('contrato') !== -1) return 'contrato';
        if (
          blob.indexOf('tamanho') !== -1 ||
          blob.indexOf('equipe') !== -1 ||
          blob.indexOf('usuario') !== -1 ||
          blob.indexOf('usuário') !== -1 ||
          blob.indexOf('corretor') !== -1
        ) return 'tamanho';
        return null;
      }

      var origOpen = XMLHttpRequest.prototype.open;
      var origSend = XMLHttpRequest.prototype.send;

      XMLHttpRequest.prototype.open = function(method, url) {
        this._kenloUrl = typeof url === 'string' ? url : url.toString();
        this._kenloMethod = method;
        return origOpen.apply(this, arguments);
      };

      XMLHttpRequest.prototype.send = function(body) {
        if (
          this._kenloMethod === 'POST' &&
          this._kenloUrl &&
          this._kenloUrl.indexOf('app.leadster.com.br/api/chatbot/leads') !== -1 &&
          typeof body === 'string'
        ) {
          try {
            var parsed = JSON.parse(body);
            var data = parsed && parsed.message && parsed.message.data;
            if (data) {
              // Accumulate name from earlier step
              if (typeof data.Nome === 'string' && data.Nome.trim()) {
                _kenloLeadData.nome = data.Nome.trim();
              }
              // Accumulate phone from earlier step (field may be "WhatsApp" or "Telefone")
              var phone = data.WhatsApp || data.Telefone || data.Celular || data.Phone;
              if (typeof phone === 'string' && phone.trim()) {
                _kenloLeadData.telefone = phone.trim();
              }
              // Accumulate conversion type (contrato/tamanho) from qualifier step
              if (!_kenloLeadData.conversionType) {
                var ct = detectConversionType(data);
                if (ct) {
                  _kenloLeadData.conversionType = ct;
                }
              }
              // When email arrives, fire the event with all accumulated data
              if (typeof data.Email === 'string' && data.Email.indexOf('@') !== -1) {
                var email = data.Email.trim().toLowerCase();
                window.dispatchEvent(new CustomEvent('kenlo:leadster-email', {
                  detail: {
                    email: email,
                    firstName: _kenloLeadData.nome || undefined,
                    phone: _kenloLeadData.telefone || undefined,
                    conversionType: _kenloLeadData.conversionType || undefined
                  }
                }));
                // Reset for next conversation
                _kenloLeadData = { nome: null, telefone: null, conversionType: null };
              }
            }
          } catch(e) { /* ignore non-JSON bodies */ }
        }
        return origSend.apply(this, arguments);
      };

      console.log('[Kenlo] Leadster XHR interception installed');
    })();
    </script>

    <!-- Leadster chatbot — requisito de conversão: carregar imediatamente.
         Não atrasar por timeout, interação, idle ou otimização de PageSpeed
         sem validação prévia de Marketing/Growth. -->
    <script>
      (function(w,d,src,id) {
        var loading = null;
        var loaded = false;

        function loadLeadster() {
          if (loaded) return Promise.resolve();
          if (loading) return loading;
          loading = new Promise(function(resolve, reject) {
            try {
              var existing = d.querySelector('script[data-kenlo-leadster]');
              if (existing) {
                existing.addEventListener('load', function() {
                  loaded = true;
                  resolve();
                }, { once: true });
                return;
              }

              var head = d.head || d.getElementsByTagName('head')[0];
              var script = d.createElement('script');
              script.src = src;
              script.charset = 'UTF-8';
              script.defer = true;
              script.dataset.kenloLeadster = 'true';
              script.addEventListener('load', function() {
                loaded = true;
                resolve();
              }, { once: true });
              script.addEventListener('error', function() {
                script.remove();
                loading = null;
                reject(new Error('Leadster failed to load'));
              }, { once: true });
              w.neuroleadId = id;
              head.appendChild(script);
            } catch (error) {
              loading = null;
              reject(error);
            }
          });
          return loading;
        }

        w.loadKenloLeadster = loadLeadster;
        loadLeadster().catch(function() {});
      })(window, document, 'https://cdn.leadster.com.br/neurolead/neurolead.min.js', 'xdSBEw1wMyKgSGp42HvRZCz7F');
    </script>
